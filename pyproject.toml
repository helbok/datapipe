[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapipe"
version = "2.2.0"
description = "A composable, declarative data transformation and pipeline library."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ErvinTse", email = "36804877+helbok@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["data", "pipeline", "etl", "transformation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typing-extensions >= 4.12.0",
]

[project.optional-dependencies]
csv = [
    "python-dateutil >= 2.9.0.post0",
]
sql = [
    "sqlalchemy >= 2.0.36",
]
test = [
    "pytest >= 8.0.0",
]

http = [
    "requests >= 2.26.0",
]

parquet = [
    "pyarrow >= 7.0.0",
]

cli = [
    "rich >= 12.0.0",
]

dev = [
    "coverage >= 6.0",
]

json = [
    "orjson >= 3.6.8",
]

[project.scripts]
datapipe = "datapipe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
